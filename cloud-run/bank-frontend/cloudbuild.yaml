steps:
    # 1. Get backend URL
    - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
      entrypoint: "bash"
      args:
          - "-c"
          - |
              echo $(gcloud run services describe bank-backend \
              --region us-central1 \
              --format='value(status.url)') > backend_url.txt

    # 2. Build frontend image
    - name: "gcr.io/cloud-builders/docker"
      entrypoint: "bash"
      args:
          - "-c"
          - |
              docker build \
                --build-arg REACT_APP_API_URL=$(cat backend_url.txt) \
                -t us-central1-docker.pkg.dev/gcp-class-16/chloe-alexander-hao-banking-repo/frontend \
                ./cloud-run/bank-frontend

    # 3. Push frontend image
    - name: "gcr.io/cloud-builders/docker"
      args:
          [
              "push",
              "us-central1-docker.pkg.dev/gcp-class-16/chloe-alexander-hao-banking-repo/frontend",
          ]

    # 4. Deploy frontend
    - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
      entrypoint: "gcloud"
      args:
          [
              "run",
              "deploy",
              "frontend",
              "--image",
              "us-central1-docker.pkg.dev/gcp-class-16/chloe-alexander-hao-banking-repo/frontend",
              "--region",
              "us-central1",
              "--platform",
              "managed",
              "--allow-unauthenticated",
          ]

images:
    - "us-central1-docker.pkg.dev/gcp-class-16/chloe-alexander-hao-banking-repo/frontend"

options:
    logging: CLOUD_LOGGING_ONLY
