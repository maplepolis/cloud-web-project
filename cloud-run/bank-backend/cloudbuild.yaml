steps:
    # 1. Build backend image (IMPORTANT: correct directory context)
    - name: "gcr.io/cloud-builders/docker"
      dir: "backend"
      args:
          [
              "build",
              "-t",
              "us-central1-docker.pkg.dev/gcp-class-16/chloe-alexander-hao-banking-repo/backend:$COMMIT_SHA",
              ".",
          ]

    # 2. Push image to Artifact Registry
    - name: "gcr.io/cloud-builders/docker"
      args:
          [
              "push",
              "us-central1-docker.pkg.dev/gcp-class-16/chloe-alexander-hao-banking-repo/backend:$COMMIT_SHA",
          ]

    # 3. Deploy to Cloud Run
    - name: "gcr.io/cloud-builders/gcloud"
      args:
          [
              "run",
              "deploy",
              "bank-backend",
              "--image",
              "us-central1-docker.pkg.dev/gcp-class-16/chloe-alexander-hao-banking-repo/backend:$COMMIT_SHA",
              "--region",
              "us-central1",
              "--platform",
              "managed",
              "--allow-unauthenticated",
          ]

images:
    - "us-central1-docker.pkg.dev/gcp-class-16/chloe-alexander-hao-banking-repo/backend:$COMMIT_SHA"

options:
    logging: CLOUD_LOGGING_ONLY
