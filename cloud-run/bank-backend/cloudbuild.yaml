steps:
    # 1. Build backend Docker image
    - name: "gcr.io/cloud-builders/docker"
      id: "build-backend"
      args:
          [
              "build",
              "-t",
              "us-central1-docker.pkg.dev/gcp-class-16/chloe-alexander-hao-banking-repo/backend:$COMMIT_SHA",
              ".",
          ]

    # 2. Push image to Artifact Registry
    - name: "gcr.io/cloud-builders/docker"
      id: "push-backend"
      args:
          [
              "push",
              "us-central1-docker.pkg.dev/gcp-class-16/chloe-alexander-hao-banking-repo/backend:$COMMIT_SHA",
          ]

    # 3. Deploy to Cloud Run
    - name: "gcr.io/cloud-builders/gcloud"
      id: "deploy-backend"
      args:
          [
              "run",
              "deploy",
              "bank-backend",
              "--image",
              "us-central1-docker.pkg.dev/gcp-class-16/chloe-alexander-hao-banking-repo/backend:$COMMIT_SHA",
              "--region",
              "us-central1",
              "--platform",
              "managed",
              "--allow-unauthenticated",
          ]

# Store image in Artifact Registry
images:
    - "us-central1-docker.pkg.dev/gcp-class-16/chloe-alexander-hao-banking-repo/backend:$COMMIT_SHA"

# Fix logging error you previously hit
options:
    logging: CLOUD_LOGGING_ONLY
