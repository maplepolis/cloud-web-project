steps:
  # Step 1: Build backend container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'build',
        '-t',
        '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_BACKEND_REPO_NAME}/bank-backend:${SHORT_SHA}',
        './cloud-run/bank-backend'
      ]
    id: 'build-backend-image'
 
  # Step 2: Push backend image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'push',
        '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_BACKEND_REPO_NAME}/bank-backend:${SHORT_SHA}'
      ]
    id: 'push-backend-image'
 
  # Step 3: Deploy backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      [
        'run',
        'deploy',
        'bank-backend',
        '--image',
        '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_BACKEND_REPO_NAME}/bank-backend:${SHORT_SHA}',
        '--region',
        '${_REGION}',
        '--platform',
        'managed',
        '--allow-unauthenticated'
      ]
    id: 'deploy-backend-cloudrun'
 
  # Get backend URL for frontend configuration
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        BACKEND_URL=$(gcloud run services describe bank-backend --region=${_REGION} --format='value(status.url)')
        echo "Backend URL: $BACKEND_URL"
        echo "$BACKEND_URL" > /workspace/backend_url.txt
    id: 'get-backend-url'
 
substitutions:
  _REGION: us-central1
  _BACKEND_REPO_NAME: chloe-alexander-hao-banking-repo
 
images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_BACKEND_REPO_NAME}/bank-backend:${SHORT_SHA}'
 
options:
  logging: CLOUD_LOGGING_ONLY